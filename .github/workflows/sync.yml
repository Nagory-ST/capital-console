name: Sync Notion → data.json

on:
  schedule:
    - cron: "30 6 * * 1-5"      # 08:30 Paris (hiver) / 07:30 (été), jours de bourse
  workflow_dispatch:            # bouton "Run workflow" pour forcer

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WRITE_BACK: ${{ vars.NOTION_WRITE_BACK || 'false' }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: python scripts/sync.py

      - name: Commit data.json si modifié
        run: |
          git config user.name "capital-bot"
          git config user.email "capital-bot@users.noreply.github.com"
          git add -A docs/
          git diff --cached --quiet || git commit -m "data: sync $(date -u +%Y-%m-%dT%H:%M)"
          git push
